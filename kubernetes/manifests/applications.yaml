# ==============================================================================
# 1. CATALOG SERVICE
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: retail-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
      - name: server
        image: public.ecr.aws/aws-containers/retail-store-sample-catalog:1.5.0
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        ports:
        - containerPort: 8080
        env:
        - name: DB_USER
          valueFrom: {secretKeyRef: {name: bedrock-db-credentials, key: MYSQL_USER}}
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: bedrock-db-credentials, key: MYSQL_PASSWORD}}
        - name: DB_HOST
          value: "rds-mysql-catalog.cahm0saq2dfl.us-east-1.rds.amazonaws.com"
        - name: DB_NAME
          value: "catalog"
---
# (Repeat the pattern above for the ORDERS and CARTS services, 
# ensuring you inject the exact same 'resources' and 'probes' blocks)
# ==============================================================================
# 2. ORDERS SERVICE
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
  namespace: retail-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      containers:
      - name: server
        image: public.ecr.aws/aws-containers/retail-store-sample-orders:1.5.0
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        ports:
        - containerPort: 8080
        env:
        - name: DB_USER
          valueFrom: {secretKeyRef: {name: bedrock-db-credentials, key: POSTGRES_USER}}
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: bedrock-db-credentials, key: POSTGRES_PASSWORD}}
        - name: DB_HOST
          value: "rds-postgres-orders.cahm0saq2dfl.us-east-1.rds.amazonaws.com"
        - name: DB_NAME
          value: "orders"
# ... (Continue this for Carts and UI services)