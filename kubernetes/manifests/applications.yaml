# ==============================================================================
# 3. CARTS SERVICE (DynamoDB NoSQL Consumer)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carts-service
  namespace: retail-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: carts
  template:
    metadata:
      labels:
        app: carts
    spec:
      containers:
      - name: server
        image: public.ecr.aws/aws-containers/retail-store-sample-cart:1.5.0
        ports:
        - containerPort: 8080
        env:
        - name: CARTS_DYNAMODB_TABLENAME
          value: "retail-store-carts"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: bedrock-db-credentials
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: bedrock-db-credentials
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_DEFAULT_REGION
          valueFrom:
            secretKeyRef:
              name: bedrock-db-credentials
              key: AWS_REGION
---
apiVersion: v1
kind: Service
metadata:
  name: carts
  namespace: retail-app
spec:
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: carts

---
# ==============================================================================
# 4. FRONTEND UI ROUTER
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-service
  namespace: retail-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        ---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: retail-app
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080       # 🟢 Crucial Fix: Routes external port 80 traffic to container port 8080
    protocol: TCP
  selector:
    app: ui                # 🟢 Crucial Fix: Binds this service directly to your UI deployment pods