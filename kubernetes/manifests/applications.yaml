# ==============================================================================
# 1. CATALOG SERVICE (MySQL Consumer)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: retail-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
      - name: server
        image: public.ecr.aws/aws-containers/retail-store-sample-catalog:1.5.0
        ports:
        - containerPort: 8080
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: bedrock-db-credentials
              key: MYSQL_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bedrock-db-credentials
              key: MYSQL_PASSWORD
        - name: DB_HOST
          value: "rds-mysql-catalog.cahm0saq2dfl.us-east-1.rds.amazonaws.com"
        - name: DB_NAME
          value: "catalog"
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: retail-app
spec:
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: catalog

---
